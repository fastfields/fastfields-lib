name: Bump submodule pin

# Bumps the `impl` submodule pin to fastfields-cpu-impl's current default
# branch HEAD and opens a PR -- fastfields-lib#15.
#
# Two triggers:
#   * workflow_dispatch -- manual, from the Actions tab. Works today.
#   * repository_dispatch (type "submodule-updated") -- fired automatically
#     by fastfields-cpu-impl's notify-parent.yaml on every push to its main.
#     Needs SUBMODULE_DISPATCH_TOKEN set as a secret on fastfields-cpu-impl
#     (see that repo's notify-parent.yaml for what it needs) -- nothing to
#     configure here.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-updated]

jobs:
  bump:
    permissions:
      contents: write
      pull-requests: write
    uses: fastfields/.github/.github/workflows/cpp-submodule-bump.yml@main
    with:
      path: impl
      repo: fastfields/fastfields-cpu-impl
