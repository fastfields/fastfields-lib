name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a newer commit is pushed to the same PR/branch,
# so this heavy compile gate does not queue up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # fastfields-cpu-lib is the primary automated test gate for the whole
    # project (no GPU in CI): it compiles libfastfields-cpu.so and runs each
    # tests/test_<module>.cpp against a brute-force reference.
    #
    # The matrix runs the suite twice, under both boundary-condition compile
    # policies (see kernels/bounds.h):
    #   static  -- every condition gets its own instantiation (the default, and
    #              what a CPU release builds)
    #   dynamic -- every condition shares the one `bound::type::Dynamic`
    #              runtime instantiation (the extreme the CUDA build proves is
    #              viable, since the fully-static matrix needs ~16 GB in ptxas)
    #   cuda-default -- the *mixed* policy fastfields-cuda-lib actually ships:
    #              DCT2 (symmetric) and DST2 (antisymmetric, sign-flipping)
    #              static, the other six Dynamic. Mixing static and Dynamic
    #              instantiations in one translation unit is its own case, and
    #              it is the configuration real CUDA builds use, so it gets its
    #              own leg rather than being inferred from the two extremes.
    # All three must produce identical results against the reference oracle;
    # without these legs the Dynamic code path has no automated coverage
    # anywhere (there is no GPU in CI).
    #
    # Each leg pins *both* BOUNDFLAGS and SPLINEFLAGS explicitly (spline order
    # is pushpull's second Dynamic axis, fastfields-cuda-lib#30/#31) so a leg's
    # name describes its actual policy on both axes, not just bounds -- the
    # Makefile's own `test` target has a sparser *default* for whichever axis
    # is left unset (see Makefile), which would otherwise silently weaken the
    # "static"/"dynamic" legs' coverage guarantee on the axis they don't
    # mention explicitly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - bounds: static
            boundflags: ""
            splineflags: ""
          - bounds: dynamic
            boundflags: "-DFF_STATIC_BOUNDS=0"
            splineflags: "-DFF_STATIC_SPLINES=0"
          - bounds: cuda-default
            boundflags: "-DFF_STATIC_BOUNDS=0 -DFF_STATIC_BOUND_DCT2=1 -DFF_STATIC_BOUND_DST2=1"
            splineflags: "-DFF_STATIC_SPLINES=0 -DFF_STATIC_SPLINE_NEAREST=1 -DFF_STATIC_SPLINE_LINEAR=1 -DFF_STATIC_SPLINE_QUADRATIC=1 -DFF_STATIC_SPLINE_CUBIC=1"
    name: test (bounds=${{ matrix.bounds }})
    runs-on: ubuntu-latest
    # A clean build + all module suites is a few minutes; 30 min is a generous
    # ceiling so a hung compile/test fails fast instead of burning the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ccache
      # apt's ccache (4.x) defaults CCACHE_DIR to ~/.cache/ccache (XDG), not
      # the legacy ~/.ccache -- pin it explicitly so the actions/cache path
      # below actually matches where ccache reads/writes. Without this, the
      # cache save step silently no-ops ("Path(s) ... do not exist") and every
      # run stays cold; caught by inspecting a real run's logs.
      - name: Set CCACHE_DIR
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      # Keyed per matrix leg (bounds/splineflags select different object-file
      # content) plus a source hash, so a source-only push still reuses the
      # previous run's ccache dir via the restore-keys prefix fallback --
      # ccache itself keys individual objects internally, this just needs to
      # be broad enough that unrelated pushes hit a warm directory.
      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-fastfields-cpu-lib-${{ matrix.bounds }}-${{ hashFiles('**/*.h', '**/*.cpp') }}
          restore-keys: |
            ${{ runner.os }}-ccache-fastfields-cpu-lib-${{ matrix.bounds }}-
      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache -z
      - name: Build and run tests
        # -j2: the 8 test binaries build independently (each recompiles the
        # module set), so build them 2-at-a-time. Kept conservative (not
        # -j$(nproc)) because each is a heavy -O3 template compile and the
        # runner has 16 GB; 2 in parallel stays well clear of OOM while
        # roughly halving this gate's wall-clock. CXX is "ccache clang++" --
        # the Makefile forwards $(CXX) straight into every compile/link
        # recipe, so this needs no Makefile change; ccache transparently
        # caches each `-c` object compile (see the Tests section above).
        run: make -j2 -C . test CXX="ccache clang++" BOUNDFLAGS="${{ matrix.boundflags }}" SPLINEFLAGS="${{ matrix.splineflags }}"
      - name: Show ccache stats
        if: always()
        run: ccache -s

  # The same suite again under AddressSanitizer + UndefinedBehaviorSanitizer.
  #
  # Why this is a separate job and not a fourth `bounds=` leg: it is not a
  # different compile *policy*, it is a different question. The three legs above
  # ask "do all three boundary/spline policies agree with the reference oracle?";
  # this one asks "does the code the oracle agrees with actually have defined
  # behaviour?". Those answers came apart badly in practice -- fastfields-kernels#75
  # was 55 UBSan reports (a BVH node buffer of raw bytes reinterpret_cast to
  # polymorphic `Node`s whose lifetime never began) that every one of the three
  # legs reported as PASSED, because the flagged member accesses devirtualise and
  # the results happen to come out right. fastfields-kernels#74 was a heap
  # over-read found the same way. Neither was visible to the gate above.
  #
  # Policy choices, each of which matters:
  #   * `-fno-sanitize-recover=all` -- UBSan *reports and continues* by default,
  #     so without this the job would print 55 "runtime error:" lines and still
  #     exit 0. This makes the first one fatal, which is what makes it a gate.
  #   * `-O1` rather than the suite's `-O3`: enough optimisation to keep the
  #     tests' runtime sane, low enough that ASan's instrumentation does not
  #     multiply an already-heavy template compile past the timeout.
  #   * the `dynamic` bound/spline policy (one shared `Dynamic` instantiation
  #     per axis instead of the full 8x8 static matrix): the cheapest leg to
  #     compile, and the sanitizers care about the code paths, which are the
  #     same ones. Correctness across policies is the matrix above's job.
  #   * the extra `libclang-rt-<N>-dev` package. `apt-get install clang` does
  #     NOT pull in compiler-rt's sanitizer runtimes: every object compiles
  #     fine and the *link* then fails with "cannot find
  #     libclang_rt.asan-x86_64.a". The package is release-numbered, so the
  #     number is derived from `clang -dumpversion` rather than hard-coded,
  #     and a runner-image clang bump needs no edit here.
  #     (g++ would have brought its libasan/libubsan along for free, but it
  #     cannot build this tree: kernels/restrict.h calls `index2sub<D>` while
  #     only resize.h includes batch.h for it, which gcc's two-phase lookup
  #     rejects -- fastfields-kernels#77.)
  # Kept off the `test` matrix's ccache key (its own `-sanitize-` prefix), since
  # the objects are built with entirely different flags.
  sanitize:
    name: sanitize (asan+ubsan)
    runs-on: ubuntu-latest
    # Same 30 min ceiling as the gate above. A cold local run of exactly this
    # command (4 cores, no ccache) is ~7 min: -O1 + the `dynamic` policy more
    # than pay for ASan's instrumentation overhead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ccache
      # Separate step, and after clang is installed, so `clang -dumpversion`
      # resolves: the runtimes are packaged per clang major release and the
      # right one has to be picked at run time rather than pinned here.
      - name: Install the matching compiler-rt sanitizer runtimes
        run: sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
      - name: Set CCACHE_DIR
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-fastfields-cpu-lib-sanitize-${{ hashFiles('**/*.h', '**/*.cpp') }}
          restore-keys: |
            ${{ runner.os }}-ccache-fastfields-cpu-lib-sanitize-
      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache -z
      - name: Build and run tests under ASan + UBSan
        # CXXFLAGS is assigned on the command line, which overrides the
        # Makefile's `CXXFLAGS +=` wholesale (GNU make: a command-line variable
        # wins over any in-makefile assignment, `+=` included) -- so everything
        # the Makefile would otherwise contribute (-std=c++11, -O3 and the two
        # clang diagnostic limits) is restated here, with -O3 swapped for -O1.
        # -fPIC likewise: the object rule adds $(PICFLAG) itself, the link rule
        # does not.
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_stack_use_after_return=1
        run: |
          make -j2 -C . test CXX="ccache clang++" \
            CXXFLAGS="-std=c++11 -O1 -g -fPIC -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -ferror-limit=1 -ftemplate-backtrace-limit=0" \
            BOUNDFLAGS="-DFF_STATIC_BOUNDS=0" \
            SPLINEFLAGS="-DFF_STATIC_SPLINES=0"
      - name: Show ccache stats
        if: always()
        run: ccache -s
