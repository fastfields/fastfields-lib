name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # fastfields-cpu-lib is the primary automated test gate for the whole
    # project (no GPU in CI): it compiles libfastfields-cpu.so and runs each
    # tests/test_<module>.cpp against a brute-force reference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and run tests
        run: make -C . test CXX=clang++
