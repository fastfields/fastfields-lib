name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a newer commit is pushed to the same PR/branch,
# so this heavy compile gate does not queue up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # fastfields-cpu-lib is the primary automated test gate for the whole
    # project (no GPU in CI): it compiles libfastfields-cpu.so and runs each
    # tests/test_<module>.cpp against a brute-force reference.
    #
    # The matrix runs the suite twice, under both boundary-condition compile
    # policies (see kernels/bounds.h):
    #   static  -- every condition gets its own instantiation (the default, and
    #              what a CPU release builds)
    #   dynamic -- every condition shares the one `bound::type::Dynamic`
    #              runtime instantiation (the extreme the CUDA build proves is
    #              viable, since the fully-static matrix needs ~16 GB in ptxas)
    #   cuda-default -- the *mixed* policy fastfields-cuda-lib actually ships:
    #              DCT2 (symmetric) and DST2 (antisymmetric, sign-flipping)
    #              static, the other six Dynamic. Mixing static and Dynamic
    #              instantiations in one translation unit is its own case, and
    #              it is the configuration real CUDA builds use, so it gets its
    #              own leg rather than being inferred from the two extremes.
    # All three must produce identical results against the reference oracle;
    # without these legs the Dynamic code path has no automated coverage
    # anywhere (there is no GPU in CI).
    strategy:
      fail-fast: false
      matrix:
        include:
          - bounds: static
            boundflags: ""
          - bounds: dynamic
            boundflags: "-DFF_STATIC_BOUNDS=0"
          - bounds: cuda-default
            boundflags: "-DFF_STATIC_BOUNDS=0 -DFF_STATIC_BOUND_DCT2=1 -DFF_STATIC_BOUND_DST2=1"
    name: test (bounds=${{ matrix.bounds }})
    runs-on: ubuntu-latest
    # A clean build + all module suites is a few minutes; 30 min is a generous
    # ceiling so a hung compile/test fails fast instead of burning the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and run tests
        # -j2: the 8 test binaries build independently (each recompiles the
        # module set), so build them 2-at-a-time. Kept conservative (not
        # -j$(nproc)) because each is a heavy -O3 template compile and the
        # runner has 16 GB; 2 in parallel stays well clear of OOM while
        # roughly halving this gate's wall-clock.
        run: make -j2 -C . test CXX=clang++ BOUNDFLAGS="${{ matrix.boundflags }}"
