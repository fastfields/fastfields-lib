name: Test

# fastfields-kernels is header-only, so it cannot build or test on its own.
# This workflow validates a change by building the fastfields-cpu-lib test
# suite (the project's primary correctness gate) with THIS repo's commit
# pinned as the nested `kernels` submodule -- so a kernel regression fails
# here rather than only surfacing downstream.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-via-cpu-lib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick the fastfields-cpu-lib ref to test against
        # A change to the kernel *API* is inherently coordinated: it needs the
        # matching fastfields-cpu-impl / fastfields-cpu-lib commits to compile
        # at all, so validating it against cpu-lib@main can never pass and the
        # gate would have to be merged red (the recurring layered-submodule
        # problem in fastfields-lib#10 / #15).
        #
        # So: if fastfields-cpu-lib has a branch with the same name as this PR's
        # head branch, test against that; otherwise fall back to main. A normal,
        # non-coordinated kernels change has no such branch and is gated against
        # main exactly as before.
        id: pick
        env:
          GH_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=main
          if [ -n "$HEAD_REF" ] && gh api \
               "repos/fastfields/fastfields-cpu-lib/branches/$HEAD_REF" \
               --silent 2>/dev/null; then
            ref="$HEAD_REF"
          fi
          echo "Testing against fastfields-cpu-lib@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out fastfields-cpu-lib (recursive)
        uses: actions/checkout@v5
        with:
          repository: fastfields/fastfields-cpu-lib
          ref: ${{ steps.pick.outputs.ref }}
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          path: cpu-lib

      - name: Pin the nested kernels submodule to this commit
        # cpu-lib -> impl (fastfields-cpu-impl) -> kernels (this repo). Point
        # the kernels checkout at the commit under test (PR head, or the pushed
        # SHA) so cpu-lib compiles against these headers.
        env:
          KERNELS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd cpu-lib/impl/kernels
          git fetch --depth 1 origin "$KERNELS_SHA"
          git checkout --detach "$KERNELS_SHA"
          git log -1 --oneline

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ccache

      # apt's ccache (4.x) defaults CCACHE_DIR to ~/.cache/ccache (XDG), not
      # the legacy ~/.ccache -- pin it explicitly so actions/cache below
      # actually matches where ccache reads/writes (verified against a real
      # run on fastfields-cpu-lib, which showed the cache save silently
      # no-op without this).
      - name: Set CCACHE_DIR
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-fastfields-kernels-${{ hashFiles('cpu-lib/**/*.h', 'cpu-lib/**/*.cpp') }}
          restore-keys: |
            ${{ runner.os }}-ccache-fastfields-kernels-

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache -z

      - name: Build and run the cpu-lib test suite
        # CXX="ccache clang++": cpu-lib's Makefile forwards $(CXX) straight
        # into every compile/link recipe, so no Makefile change is needed.
        run: make -j2 -C cpu-lib test CXX="ccache clang++"

      - name: Show ccache stats
        if: always()
        run: ccache -s
