name: Docs

# Builds this repo's documentation and publishes it as the /lib/ section of the
# fastfields.github.io Pages site:
#
#     /          fastfields.github.io (landing page + shared theme)
#     /python/   fastfields
#     /dlpack/   fastfields-dlpack
#     /lib/      here
#     /whl/      whl -- its own project Pages site, independent
#
# Deliberately a separate workflow from ci.yml, and deliberately narrow. It
# compiles nothing: the docs here are hand-written prose (index, architecture,
# api) with no mkdocstrings and no API extraction, so none of ci.yml's gates or
# toolchains are involved and nothing here can affect them.
#
# Note the path filter is `docs/**`, which includes docs/legacy/ -- the six
# pre-consolidation repos' READMEs and CLAUDE.md files. Those ARE built and
# published, at /lib/legacy/..., and they are in the nav under `libfastfields`.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - ".github/workflows/docs.yaml"
  # The nav check below gates pull requests too -- that is the point of it, and
  # a menu that only breaks after merge is the situation this is here to end.
  # `build-deploy` stays push-only.
  #
  # The path list is repeated rather than shared with a YAML anchor: GitHub
  # Actions does not support anchors or aliases in workflow files.
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The top-level documentation menu is duplicated across four repositories --
  # zensical has no include mechanism -- and it drifted until no two sections
  # agreed on it. This job is the guard, and it has to run HERE, against THIS
  # repo's zensical.toml: a check living in only one repo cannot see another
  # repo's drift. The canonical list is in DOCS-THEME.md in fastfields/.github.
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # --selftest first: it checks the checker against known-good and
      # known-broken navs, so a check that has quietly stopped failing on
      # anything cannot pass for a working one.
      - run: python3 tools/check-docs-nav.py --selftest
      - run: python3 tools/check-docs-nav.py --check zensical.toml

  build-deploy:
    needs: nav
    # The nav check runs on pull requests; publishing does not.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Stops THIS repo racing itself. It is NOT the cross-repo guard: concurrency
    # groups are per-repository, so they cannot serialize this job against the
    # publishers in fastfields.github.io / fastfields / fastfields-dlpack. Those
    # races are handled by the retry loop in tools/publish-docs.sh. Scoped to
    # this job rather than the workflow so a pull request's nav check does not
    # queue behind a publish.
    concurrency:
      group: publish-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      - run: zensical build --clean

      # The wanted path is /lib/, which differs from this repo's name, so
      # actions/deploy-pages cannot produce it: it only ever deploys to the
      # repo it runs in. The script writes ONLY `lib/` and cannot reach the
      # landing page or the other sections.
      #
      # Pushed over SSH as the DOCS_DEPLOY_KEY organization secret: the private
      # half of a deploy key registered on fastfields.github.io with write
      # access, scoped to this repo, fastfields-lib and fastfields-dlpack. The
      # default GITHUB_TOKEN cannot be used -- it is scoped to the repo it runs
      # in. The script checks the secret is non-empty before doing any work and
      # fails with one line naming it if not.
      - name: Publish the C++/CUDA section into fastfields.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: ./tools/publish-docs.sh --auth ssh --subdir lib --site site
