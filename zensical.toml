[project]
site_name = "fastfields-lib"
site_description = "The device-dispatch hub of the fastfields C++/CUDA libraries (libfastfields.so)."
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/lib/"
repo_url = "https://github.com/fastfields/fastfields-lib"
repo_name = "fastfields/fastfields-lib"
copyright = "Copyright &copy; 2026 The fastfields authors"
# The shared theme. Served by the fastfields.github.io repo, referenced by
# absolute URL so the four sections look alike from one source -- and so no
# docs build has to fetch another repository.
extra_css = ["https://fastfields.github.io/stylesheets/extra.css"]
nav = [
  {"fastfields home" = "https://fastfields.github.io/"},
  {"Home" = "index.md"},
  {"Architecture" = "architecture.md"},
  {"API families" = "api.md"},
  {"Python packages" = "https://fastfields.github.io/python/"},
  {"Raw DLPack binding" = "https://fastfields.github.io/dlpack/"},
  {"Wheel index" = "https://fastfields.github.io/whl/"},
]

[project.theme]
language = "en"
features = ["content.code.copy", "content.code.select", "navigation.indexes"]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.toc]
toc_depth = 3
